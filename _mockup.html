<title>BuildUp Mockup Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#000000;
  --charcoal:#222222;
  --grey:#666666;
  --muted:#888888;
  --line:#DDDDDD;
  --line-soft:#EEEEEE;
  --wash:#F5F5F5;
  --surface:#F7F7F7;
  --paper:#FFFFFF;
  --success:#249689;
  --display:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --max:1180px;
  --r-sm:8px; --r-md:16px; --r-lg:24px;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-family:var(--body);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0}
.section-kicker{font-family:var(--body);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0 0 14px}
.h-section{font-family:var(--display);font-size:clamp(22px,3.4vw,32px);font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-align:center;margin:0}
.lede{color:var(--grey);max-width:62ch;margin:0 auto}
.eyebrow::before,.section-kicker::before,.inside .kicker::before{content:"";display:inline-block;width:22px;height:1px;background:currentColor;vertical-align:middle;margin-right:11px;opacity:.55}
.trialnote{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.62);margin:16px 0 0}
.plan .trial{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-top:9px;color:var(--charcoal)}
.center{text-align:center}

/* ---------- layout ---------- */
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.section{padding:84px 0}
.section.tight{padding:60px 0}
.section.wash{background:var(--wash)}
.section.ink{background:var(--ink);color:#fff}
.section.ink .h-section,.section.ink h3{color:#fff}
.section.ink .lede,.section.ink .section-kicker{color:rgba(255,255,255,.66)}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.hdr-in{max-width:var(--max);margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:28px;flex-wrap:nowrap}
.logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.03em;line-height:1;display:flex;align-items:center;gap:2px;flex:1 0 auto}
.logo b{font-weight:700}
.logo span{font-weight:700;color:var(--ink)}
.nav{display:flex;gap:34px;flex:1;justify-content:center;flex-wrap:nowrap}
.nav a{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;color:var(--charcoal);padding:4px 0;border-bottom:1px solid transparent;transition:border-color .18s}
.nav a:hover,.nav a.on{border-bottom-color:var(--ink)}
.hdr-cta{display:flex;align-items:center;gap:14px;flex:1 0 auto;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--body);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:13px 26px;border-radius:999px;background:var(--ink);color:#fff;border:1px solid var(--ink);transition:background .18s,color .18s,transform .18s}
.btn:hover{background:#fff;color:var(--ink);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.on-dark{background:#fff;color:var(--ink);border-color:#fff}
.btn.on-dark:hover{background:transparent;color:#fff}
.btn.wide{padding:15px 44px}
.burger{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:999px;align-items:center;justify-content:center}
.burger span{display:block;width:15px;height:1px;background:var(--ink);position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:15px;height:1px;background:var(--ink)}
.burger span::before{top:-5px}.burger span::after{top:5px}

/* ---------- media placeholders ---------- */
.media{position:relative;overflow:hidden;background:
   repeating-linear-gradient(135deg,rgba(0,0,0,.028) 0 2px,transparent 2px 9px),
   linear-gradient(160deg,#e9e9e9 0%,#d6d6d6 45%,#bdbdbd 100%);
   display:block}
.media.dark{background:
   repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),
   linear-gradient(160deg,#3a3a3a 0%,#1c1c1c 60%,#0a0a0a 100%)}
.media .tag{position:absolute;left:14px;bottom:12px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.22);padding:4px 8px;border-radius:3px;background:rgba(255,255,255,.55);backdrop-filter:blur(2px)}
.media.dark .tag{color:rgba(255,255,255,.66);border-color:rgba(255,255,255,.3);background:rgba(0,0,0,.28)}
.media .inner{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.zoom{overflow:hidden}
.zoom .media{transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.zoom:hover .media{transform:scale(1.06)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:clamp(440px,52vw,820px);display:grid;align-items:end;justify-items:center;text-align:center;color:#fff;padding:96px 24px clamp(64px,8.5vw,120px);overflow:hidden}
.hero .media{position:absolute;inset:0}
.hero.full{aspect-ratio:16/9;min-height:0;padding-top:64px}
.hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,.30) 34%,rgba(0,0,0,.52) 62%,rgba(0,0,0,.88) 86%,#000 100%)}
.hero-in{position:relative;z-index:2;max-width:820px}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero h1{font-size:clamp(26px,5vw,44px);letter-spacing:.14em;text-transform:uppercase;color:#fff;margin:14px 0 0;line-height:1.24}
.hero p.sub{color:rgba(255,255,255,.82);margin:9px auto 0;max-width:56ch}
.hero .btn{margin-top:28px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink);position:relative;z-index:1}
.stat{background:transparent;padding:42px 24px 46px;text-align:center;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:1px;background:rgba(255,255,255,.16)}
.stat .n{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;color:#fff;font-variant-numeric:tabular-nums}
.stat .n .dash{display:inline-block;width:.42em;height:1px;background:rgba(255,255,255,.5);vertical-align:.3em;margin:0 .22em}
.stat .l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.58);margin-top:8px}
.stat .d{font-size:13px;color:rgba(255,255,255,.44);margin-top:10px;max-width:30ch;margin-inline:auto}

/* ---------- membership ---------- */
.member{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:center}
.member .shot{aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden;position:relative}
.plan{border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;position:relative;margin-top:14px;background:#fff;transition:border-color .18s,box-shadow .18s}
.plan:hover{border-color:var(--charcoal)}
.plan.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.plan .dot{width:19px;height:19px;border-radius:50%;border:1px solid var(--line);flex:none;display:grid;place-items:center;order:2;margin-left:auto}
.plan.sel .dot{border-color:var(--ink)}
.plan.sel .dot::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--ink)}
.plan .mini{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.plan .nm{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin:4px 0 2px}
.plan .pr{font-size:14px;color:var(--charcoal);font-variant-numeric:tabular-nums}
.plan .rn{font-size:12px;color:var(--muted);font-style:italic}
.ribbon{position:absolute;top:-11px;right:16px;background:var(--ink);color:#fff;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:5px 12px;border-radius:999px}

/* ---------- phones ---------- */
.phones{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.phones.three{grid-template-columns:repeat(3,1fr);max-width:840px;margin:0 auto}
.pcol{text-align:center}
.pcol .media{display:block;position:static;width:100%;max-width:250px;margin:0 auto;background:none;border-radius:0;min-height:0}
.pcol .media>img{height:auto;object-fit:contain}
.phone{width:100%;max-width:186px;margin:0 auto;aspect-ratio:9/19;border-radius:26px;border:1px solid var(--line);background:#fff;padding:7px;box-shadow:0 8px 25px rgba(0,0,0,.07)}
.section.ink .phone{border-color:rgba(255,255,255,.22);background:#111;box-shadow:none}
.screen{height:100%;border-radius:20px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:9px 8px}
.section.ink .screen{background:#1a1a1a}
.sbar{height:7px;border-radius:2px;background:var(--line);width:38%}
.section.ink .sbar{background:#333}
.scard{border-radius:9px;background:#fff;border:1px solid var(--line-soft);flex:1;min-height:0;position:relative;overflow:hidden}
.section.ink .scard{background:#222;border-color:#2c2c2c}
.scard.fill{background:repeating-linear-gradient(135deg,rgba(0,0,0,.03) 0 2px,transparent 2px 8px),linear-gradient(160deg,#dedede,#b9b9b9)}
.srow{height:9px;border-radius:3px;background:var(--line-soft);margin:7px}
.pcol h3{font-family:var(--display);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:20px 0 7px}
.pcol p{font-size:13px;color:var(--grey);margin:0;max-width:26ch;margin-inline:auto}

/* ---------- program grid ---------- */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pcard{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line-soft);background:#fff;display:flex;flex-direction:column;text-align:left;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.pcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.09)}
.pcard .thumb{aspect-ratio:4/3;overflow:hidden;position:relative}
.pcard .thumb .media{position:absolute;inset:0}
.pcard:hover .thumb .media{transform:scale(1.07)}
.pcard .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard h3{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.02em}
.pcard p{margin:0;font-size:13.5px;color:var(--grey);flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--grey)}
.chip.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.soon{background:var(--wash);color:var(--muted)}
.arrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center;margin-top:2px}
.pcard:hover .arrow span{transform:translateX(4px)}
.arrow span{transition:transform .25s}

/* ---------- recipes ---------- */
.recipes{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.rcard{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line-soft);background:#fff;text-align:left;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.rcard:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.08)}
.rcard .thumb{aspect-ratio:1/1;overflow:hidden;position:relative}
.rcard .thumb .media{position:absolute;inset:0}
.rcard:hover .thumb .media{transform:scale(1.08)}
.rcard .body{padding:13px 14px 16px}
.rcard h4{font-family:var(--display);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.35}
.macros{display:flex;gap:9px;margin-top:9px;font-size:10px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.macros b{color:var(--charcoal);font-weight:600}
.rcard .thumb .rcat{position:absolute;top:10px;left:10px;z-index:2;font-size:9px;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.9);color:var(--charcoal);border-radius:999px;padding:4px 9px}

/* ---------- videos ---------- */
.vids{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.vid{position:relative;aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden;border:1px solid rgba(0,0,0,.06);display:block;width:100%}
.section.ink .vid{border-color:rgba(255,255,255,.14)}
.vid .media{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.vid:hover .media{transform:scale(1.05)}
.vid .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;transition:transform .25s}
.vid:hover .play{transform:translate(-50%,-50%) scale(1.08)}
.vid .play::after{content:"";width:0;height:0;border-left:14px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vid .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));color:#fff}
.vid .cap b{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;display:block}
.vid .cap i{font-style:normal;font-size:11px;color:rgba(255,255,255,.72);letter-spacing:.06em}
.vid.playing .play{opacity:0}
.vid .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.vid .bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s linear}

/* ---------- comparator ---------- */
.compare{position:relative;max-width:880px;margin:0 auto;aspect-ratio:16/8;border-radius:var(--r-md);overflow:hidden;user-select:none;touch-action:none;cursor:ew-resize;border:1px solid rgba(255,255,255,.16)}
@media (max-width:767px){.compare{aspect-ratio:4/3}}
.section:not(.ink) .compare{border-color:var(--line)}
.compare .side{position:absolute;inset:0}
.compare .after{background:repeating-linear-gradient(135deg,rgba(0,0,0,.03) 0 2px,transparent 2px 9px),linear-gradient(150deg,#f0f0f0,#c9c9c9 60%,#a8a8a8)}
.compare .before{background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 9px),linear-gradient(150deg,#4a4a4a,#242424 60%,#101010);clip-path:inset(0 50% 0 0)}
.compare .lbl{position:absolute;top:14px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;padding:5px 11px;border-radius:999px}
.compare .lbl.b{left:14px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.compare .lbl.a{right:14px;background:rgba(0,0,0,.06);color:#333;border:1px solid rgba(0,0,0,.18)}
.compare .handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:50%;transform:translateX(-1px);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.compare .knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28);font-size:12px;color:var(--ink);letter-spacing:.1em}
.compare-hint{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:16px}
.section.ink .compare-hint{color:rgba(255,255,255,.55)}

/* ---------- program detail ---------- */
.inside{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.trio{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:-10px}
.trio .phone{max-width:150px;margin:0}
.trio .phone:nth-child(2){max-width:172px;z-index:2;margin:0 -18px}
.inside .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.inside h2{font-family:var(--display);font-size:clamp(24px,3.6vw,34px);letter-spacing:.14em;text-transform:uppercase;margin:10px 0 18px}
.inside p{color:var(--grey);margin:0 0 14px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.badge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;border-radius:6px;background:var(--wash);border:1px solid var(--line);color:var(--charcoal)}
.badge.k{background:var(--ink);color:#fff;border-color:var(--ink)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:8px}
.listcard h4{font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.listcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.listcard li{font-size:14px;color:var(--grey);padding-left:18px;position:relative}
.listcard li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:1px;background:var(--ink)}
.versions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.ver{font-family:var(--display);font-size:12px;letter-spacing:.08em;padding:9px 15px;border:1px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums}
.ver.now{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;counter-reset:s}
.step{text-align:center}
.step .num{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--grey)}
.step h4{font-family:var(--display);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px}
.step p{margin:0;font-size:13px;color:var(--grey)}

/* ---------- all-in-one feature block ---------- */
.allin{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;background:var(--wash);border-radius:var(--r-lg);padding:18px}
.allin .collage{border-radius:var(--r-md);overflow:hidden;position:relative;min-height:330px}
.allin .collage .media{position:absolute;inset:0}
.allin .stackr{display:flex;flex-direction:column;gap:18px}
.panel{border-radius:var(--r-md);padding:32px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px;flex:1}
.panel.k{background:var(--ink);color:#fff}
.panel.k .eyebrow{color:rgba(255,255,255,.6)}
.panel.k h3{font-family:var(--display);font-size:clamp(19px,2.3vw,25px);letter-spacing:.1em;text-transform:uppercase;color:#fff;line-height:1.3}
.panel.k .sig{font-size:12.5px;color:rgba(255,255,255,.62)}
.panel.l{background:#fff;border:1px solid var(--line)}
.panel.l p{margin:0;color:var(--grey);font-size:15px;max-width:36ch}
.panel.l .btn{align-self:flex-start;margin-top:8px}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.tile{background:var(--wash);border-radius:var(--r-md);padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:background .2s}
.tile:hover{background:var(--line-soft)}
.tile .ic{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;font-size:14px}
.tile b{font-family:var(--display);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.tile span{font-size:12.5px;color:var(--muted)}
.tile .ic svg{width:23px;height:23px;display:block}
/* ---------- bloque todo-en-uno sobre negro ---------- */
/* sobre negro: sin tarjeta exterior, capturas flotando */
.section.ink .allin{background:transparent;border:0;padding:0;gap:14px;align-items:center}
.section.ink .allin .collage{background:transparent;border-radius:0;overflow:visible;min-height:0}
.section.ink .allin .collage .media{position:static;background:none}
.section.ink .allin .collage .media>img{height:auto;object-fit:contain}
.section.ink .panel.k{background:#000;border:1px solid rgba(255,255,255,.14)}
.section.ink .panel.l{background:#fff;border-color:#fff}
.section.ink .tile{background:#101011;border:1px solid rgba(255,255,255,.1)}
.section.ink .tile:hover{background:#18181a}
.section.ink .tile b{color:#fff}
.section.ink .tile span{color:rgba(255,255,255,.5)}
.section.ink .tile .ic{border-color:rgba(255,255,255,.22);color:#fff}

/* ---------- testimonials (foto + review) ---------- */

/* ============================ ROUTER ============================ */
const app = document.getElementById("app");
const nav = document.getElementById("nav");

function route(){
  const h = (location.hash || "#/").replace(/^#\/?/,"");
  const parts = h.split("/").filter(Boolean);
  let html, key = parts[0] || "";
  if(key === "membresia") html = pageMembership();
  else if(key === "programas") html = pagePrograms();
  else if(key === "programa") html = pageProgram(parts[1]);
  else if(key === "nutricion") html = pageNutrition();
  else if(key === "comunidad") html = pageCommunity();
  else if(key === "login") html = pageLogin();
  else if(key === "crear-cuenta") html = pageSignup();
  else if(key === "listo") html = pageDone();
  else { html = pageHome(); key = ""; }
  app.innerHTML = html;
  nav.classList.remove("open");
  nav.querySelectorAll("a").forEach(a=>a.classList.toggle("on", a.dataset.r === (key==="programa"?"programas":key)));
  window.scrollTo({top:0,behavior:"instant"});
  wire();
}

/* ============================ INTERACTIONS ============================ */
function wire(){
  /* membership plan selector */
  app.querySelectorAll("[data-plan]").forEach(el=>{
    const pick = ()=>{
      el.parentElement.querySelectorAll("[data-plan]").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel");
      const after = app.querySelector("[data-after]");
      if(after && el.dataset.price) after.textContent = el.dataset.price;
    };
    el.addEventListener("click", pick);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();} });
  });

  /* before / after comparator */
  app.querySelectorAll("[data-compare]").forEach(box=>{
    const before = box.querySelector(".before");
    const handle = box.querySelector(".handle");
    const set = pct=>{
      pct = Math.max(0, Math.min(100, pct));
      before.style.clipPath = `inset(0 ${100-pct}% 0 0)`;
      handle.style.left = pct + "%";
      box.setAttribute("aria-valuenow", Math.round(pct));
    };
    const fromEvent = e=>{
      const r = box.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      set(x / r.width * 100);
    };
    let dragging = false;
    box.addEventListener("pointerdown", e=>{ dragging = true; box.setPointerCapture(e.pointerId); fromEvent(e); });
    box.addEventListener("pointermove", e=>{ if(dragging) fromEvent(e); });
    box.addEventListener("pointerup", ()=>{ dragging = false; });
    box.addEventListener("pointercancel", ()=>{ dragging = false; });
    box.addEventListener("keydown", e=>{
      const cur = parseFloat(box.getAttribute("aria-valuenow"));
      if(e.key === "ArrowLeft"){ e.preventDefault(); set(cur - 4); }
      if(e.key === "ArrowRight"){ e.preventDefault(); set(cur + 4); }
    });
    set(50);
  });

  /* video tiles — placeholder playback */
  app.querySelectorAll("[data-video]").forEach(v=>{
    const bar = v.querySelector(".bar i");
    let t = null, p = 0;
    v.addEventListener("click", ()=>{
      if(t){ clearInterval(t); t = null; v.classList.remove("playing"); bar.style.width = "0%"; p = 0; return; }
      v.classList.add("playing");
      t = setInterval(()=>{
        p += 1.6;
        bar.style.width = Math.min(p,100) + "%";
        if(p >= 100){ clearInterval(t); t = null; v.classList.remove("playing"); bar.style.width = "0%"; p = 0; }
      }, 60);
    });
  });
}

document.getElementById("burger").addEventListener("click", ()=> nav.classList.toggle("open"));
window.addEventListener("hashchange", route);
route();
</script>
